spring.application.name=Genesys-Code
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=product
spring.datasource.password=product

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
product.service.url=http://localhost:8080/
notification.service.url=http://localhost:8083/
server.port=8082